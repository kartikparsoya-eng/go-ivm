\* CLIENT-INDUCED RESET LOOP: wall-clock budget fires while parked on
\* a slow client. EXPECT: NoClientInducedReset FAILS -- the E4 reset-loop
\* seed reintroduced (slow-but-alive client triggers abort->reset->re-hydrate).
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 2
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "wall"
  GateResetFrame      = FALSE
  VersionCommitOnOpen = FALSE
  AdvanceStages       = TRUE
  FlushBeforePark     = TRUE
  ClientMayStop       = TRUE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
  NoClientInducedReset
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE