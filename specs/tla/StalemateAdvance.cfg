\* STALEMATE-FOR-ADVANCE: staging without flush-before-park (the pre-fix
\* v5 design transferred to advance). EXPECT: ALL PASS -- the stalemate
\* does NOT transfer to single-producer advance. With one producer, direct-
\* produced rows always reach the queue, so the client can consume and grant.
\* The stalemate was a MULTI-LANE issue (one lane's stage blocked another).
\* Verified with W=4 > QCap=2 (StalemateAdvanceBig) to force the staging path.
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 2
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "produce"
  GateResetFrame      = FALSE
  VersionCommitOnOpen = FALSE
  AdvanceStages       = TRUE
  FlushBeforePark     = FALSE
  ClientMayStop       = FALSE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
  NoClientInducedReset
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE