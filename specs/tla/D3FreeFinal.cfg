\* D3 rule as shipped: terminal frames ride FREE (streamgate.go:6-10),
\* same stopping client. EXPECT: TerminalNeedsNoDemand HOLDS -- a lane out
\* of rows always closes out, no matter what the app does.
SPECIFICATION Spec
CONSTANTS
  NLanes          = 1
  RowsPerLane     = 2
  W               = 2
  QCap            = 2
  StageCap        = 2
  FlushBeforePark = TRUE
  GateFinal       = FALSE
  ClientMayStop   = TRUE
INVARIANTS
  TypeOK
  RowConservation
  NeverOverProduce
  CreditAccounting
PROPERTIES
  TerminalNeedsNoDemand
CHECK_DEADLOCK FALSE
