\* CORRUPTION RISK: commit version on the OPENING frame (naive early-version).
\* EXPECT: VersionRowAtomicity FAILS -- client advances baseCookie before
\* all rows are applied; a mid-stream abort leaves a committed-but-incomplete
\* state (the corruption the staged-commit design prevents).
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 2
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "produce"
  GateResetFrame      = FALSE
  VersionCommitOnOpen = TRUE
  AdvanceStages       = TRUE
  FlushBeforePark     = TRUE
  ClientMayStop       = TRUE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE