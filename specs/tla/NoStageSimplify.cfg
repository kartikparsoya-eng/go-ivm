\* NO-STAGE SIMPLIFICATION: skip v5 staging for advance (direct delivery
\* only, queue-park on full). EXPECT: ALL PASS -- simpler than staged,
\* and the queue-park is drain-woken so no stalemate is possible.
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 2
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "produce"
  GateResetFrame      = FALSE
  VersionCommitOnOpen = FALSE
  AdvanceStages       = FALSE
  FlushBeforePark     = FALSE
  ClientMayStop       = TRUE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
  NoClientInducedReset
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE