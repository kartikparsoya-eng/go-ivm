\* STALEMATE-FOR-ADVANCE (BIG): W=4 > QCap=2 forces staging. Same knobs
\* as StalemateAdvance but with enough credit to actually stage rows.
\* If the stalemate transfers, AdvanceTerminates FAILS.  If it doesn't
\* (single-producer is safe), ALL PASS -- the key finding.
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 4
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "produce"
  GateResetFrame      = FALSE
  VersionCommitOnOpen = FALSE
  AdvanceStages       = TRUE
  FlushBeforePark     = FALSE
  ClientMayStop       = FALSE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
  NoClientInducedReset
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE
