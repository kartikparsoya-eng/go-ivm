\* D3-FOR-ADVANCE: gated reset frame + client may stop.
\* EXPECT: ResetReaches FAILS -- an aborting advance with a gated reset
\* frame parks on the credit gate; if the app stopped consuming, no
\* grant ever fires; the reset never reaches the client -> wedge until sweep.
SPECIFICATION Spec
CONSTANTS
  NumChanges          = 4
  W                   = 2
  QCap                = 2
  StageCap            = 3
  BudgetClock         = "produce"
  GateResetFrame      = TRUE
  VersionCommitOnOpen = FALSE
  AdvanceStages       = TRUE
  FlushBeforePark     = TRUE
  ClientMayStop       = TRUE
  MayAbort            = TRUE
INVARIANTS
  TypeOK
  RowConservation
  VersionRowAtomicity
  NoClientInducedReset
PROPERTIES
  ResetReaches
  AdvanceTerminates
CHECK_DEADLOCK FALSE