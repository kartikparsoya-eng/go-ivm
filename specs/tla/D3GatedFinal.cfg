\* D3 violation: terminal frames GATED on credit, app may stop consuming
\* (error path / stuck downstream). EXPECT: TerminalNeedsNoDemand FAILS
\* (a lane out of rows parks on the gate forever -- wedged until sweep).
\* Deadlock check off: an app-stop legitimately strands mid-stream rows;
\* the property under test is terminal-frame delivery only.
SPECIFICATION Spec
CONSTANTS
  NLanes          = 1
  RowsPerLane     = 2
  W               = 2
  QCap            = 2
  StageCap        = 2
  FlushBeforePark = TRUE
  GateFinal       = TRUE
  ClientMayStop   = TRUE
INVARIANTS
  TypeOK
  RowConservation
  NeverOverProduce
  CreditAccounting
PROPERTIES
  TerminalNeedsNoDemand
CHECK_DEADLOCK FALSE
