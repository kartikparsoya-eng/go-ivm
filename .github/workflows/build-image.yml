name: Build & publish sidecar image

on:
  push:
    branches: [main, feat/snapshotter-in-go, feat/streaming-hydrate, feat/napi-transport]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Two SQLites are in play and BOTH must be tested (two incidents from
  # this blind spot: the coread.go compile break, then the realtext/overlay
  # behavioral failures — neither could surface in a plain-tags run):
  #   plain tags       → mattn's bundled modern SQLite (≥3.53, 17-digit
  #                      REAL→TEXT, no wal2/BEGIN CONCURRENT/coread)
  #   libsqlite3 tags  → the vendored c/sqlite3/sqlite3.c = zero's wal2
  #                      fork (3.51, 15-digit REAL→TEXT, coread patch) —
  #                      what production actually links.
  # This job builds the wal2 static lib with the EXACT Dockerfile recipe
  # (including -ffp-contract=off — see the Dockerfile comment) and runs
  # the suite against it, then once more under plain tags. testharness/
  # is excluded (drives a TS oracle via tsx + npm deps not installed
  # here); -race stays a local-discipline gate to keep this job fast.
  test-wal2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build wal2 static lib (production recipe)
        run: |
          mkdir -p /tmp/wal2lib
          gcc -O2 -ffp-contract=off -fPIC -c c/sqlite3/sqlite3.c -o /tmp/wal2lib/sqlite3.o \
              -DSQLITE_THREADSAFE=2 \
              -DSQLITE_ENABLE_FTS5 \
              -DSQLITE_ENABLE_JSON1 \
              -DSQLITE_ENABLE_RTREE \
              -DSQLITE_OMIT_LOAD_EXTENSION \
              -DSQLITE_ENABLE_SNAPSHOT \
              -DSQLITE_ENABLE_WAL2_COREAD
          ar rcs /tmp/wal2lib/libsqlite3.a /tmp/wal2lib/sqlite3.o

      - name: go test (wal2 production lib)
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: -I${{ github.workspace }}/c/sqlite3
          # -lm: fts5Bm25Function needs log() — glibc keeps libm separate
          # (macOS libSystem and alpine musl bundle it, so only this runner
          # needs it spelled out; harmless elsewhere).
          CGO_LDFLAGS: -L/tmp/wal2lib -lm
        run: |
          go test -count=1 -tags "libsqlite3 sqlite_omit_load_extension" \
            $(go list ./... | grep -v testharness)

      - name: go test (plain tags, bundled sqlite)
        run: |
          go test -count=1 $(go list ./... | grep -v testharness)

  build:
    needs: test-wal2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Static analysis only — `go test ./...` exercises a TS harness
      # in testharness/ that needs Node + npm deps we don't install
      # here. Add a separate test job if/when that's wired up.
      - name: go vet
        # Disable ONLY the unsafeptr analyzer (all others stay on). The
        # cancel-flag machinery stores raw *C.sqlite3 handles as atomic.Uintptr
        # and the mattn fork accessors return uintptr — converting those back
        # via unsafe.Pointer trips vet's unsafeptr check, which can't tell a
        # C-allocated pointer (never GC-moved) from a Go-heap one. These are
        # C pointers by construction and safe; see internal/tablesource/
        # cancel_flag.go + the accessor doc (commit documenting the pattern).
        run: go vet -unsafeptr=false ./...

      # NAPI ABI build guard (REVIEW-napi-transport T1): the in-process
      # transport shims in napi_lib.go compile ONLY under -tags napilib, so
      # neither `go vet ./...` nor `go test ./...` ever builds them — a
      # regression there would otherwise surface only at Docker c-shared
      # stage time. Build the c-shared library here to catch it in CI.
      # Bundled sqlite (no libsqlite3 tag) so no system lib is needed.
      - name: go build (napilib c-shared ABI)
        run: |
          CGO_ENABLED=1 go build -tags napilib -buildmode=c-shared \
            -o /tmp/libgoivm-ci.so ./cmd/sidecar
          test -f /tmp/libgoivm-ci.so

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip login on PRs — we don't push images from forks.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          # PRs build but don't push — verifies the Dockerfile still
          # compiles before merging.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GO_IVM_BUILD_SHA=${{ github.sha }}
            GO_IVM_BUILD_REF=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a successful push of a new sidecar image, trigger the downstream
  # mono-better build so it rebuilds its zero-cache+go image against the
  # freshly published Go-primary feature image. Without this,
  # a marker commit to mono-better could race the go-ivm publish job and
  # bundle the previous binary.
  #
  # We use a workflow_dispatch (NOT repository_dispatch) pinned to the
  # feat/snapshotter-in-go ref. This is load-bearing: a repository_dispatch
  # ALWAYS runs the workflow from mono-better's DEFAULT branch
  # (feat/go-ivm-sidecar-async-advance), whose legacy workflow builds the
  # primary/shadow `latest` lineage from go-ivm:latest — NOT the
  # tablesrc-/shadow-tablesrc- images we actually deploy. So the dispatch
  # silently rebuilt the wrong image and the deployed tag kept a stale
  # binary (observed 2026-06-23: dispatch ran on the default branch and
  # produced shadow-latest instead of tablesrc-feat-snapshotter-in-go).
  # workflow_dispatch with an explicit ref runs the feat/snapshotter-in-go
  # workflow file in its own context (correct tablesrc matrix + build-args
  # + pulls go-ivm:feat-snapshotter-in-go), so the deployed image gets the
  # new binary. The mono workflow must exist on the default branch with a
  # workflow_dispatch trigger for the API to accept this (it does).
  #
  # Requires repo secret MONO_DISPATCH_TOKEN — a PAT (classic with `repo`
  # scope, OR fine-grained on kartikparsoya-eng/mono-better with
  # Contents:read + Metadata:read + Actions:write). The default
  # GITHUB_TOKEN is scoped to this repo only and cannot dispatch
  # cross-repo. The step is a no-op (warning-only) if the secret is unset
  # so the workflow stays green during initial setup.
  notify-downstream:
    needs: build
    # A publish from ANY Go-primary feature branch should rebuild the mono
    # image whose build matrix bundles it: feat/snapshotter-in-go feeds
    # tablesrc + shadow-tablesrc, feat/streaming-hydrate feeds
    # streaming-tablesrc (both live on mono's feat/snapshotter-in-go
    # workflow), and feat/napi-transport feeds napi-tablesrc (which lives
    # on mono's feat/napi-transport workflow — that branch's matrix also
    # includes the libgoivm.so consumer wiring). main/tag pushes publish
    # go-ivm:latest for other lineages and must not retag the feat images
    # with a mismatched binary. PRs and forks never carry the secret.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/feat/snapshotter-in-go' ||
      github.ref == 'refs/heads/feat/streaming-hydrate' ||
      github.ref == 'refs/heads/feat/napi-transport')
    runs-on: ubuntu-latest
    steps:
      - name: Compute downstream target ref
        id: target
        # Which mono-better BRANCH gets rebuilt. napi publishes are consumed
        # by mono's feat/napi-transport (its matrix has the napi-tablesrc
        # variant + Dockerfile that bakes libgoivm.so + the addon); the two
        # older branches keep feeding mono's feat/snapshotter-in-go exactly
        # as before.
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            feat/napi-transport) echo "ref=feat/napi-transport" >> "$GITHUB_OUTPUT" ;;
            *)                   echo "ref=feat/snapshotter-in-go" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Trigger mono-better build (workflow_dispatch)
        env:
          MONO_DISPATCH_TOKEN: ${{ secrets.MONO_DISPATCH_TOKEN }}
          # The mono-better branch whose workflow file + zero-cache source
          # is (re)built against the freshly published sidecar binary.
          MONO_TARGET_REF: ${{ steps.target.outputs.ref }}
          MONO_WORKFLOW_FILE: build-zero-cache-go.yml
        run: |
          if [ -z "${MONO_DISPATCH_TOKEN}" ]; then
            echo "::warning::MONO_DISPATCH_TOKEN secret not set — skipping downstream notify. See workflow comment for setup."
            exit 0
          fi
          payload=$(jq -n --arg ref "${MONO_TARGET_REF}" '{ref:$ref}')
          http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${MONO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/kartikparsoya-eng/mono-better/actions/workflows/${MONO_WORKFLOW_FILE}/dispatches" \
            -d "${payload}")
          # workflow_dispatch returns 204 No Content on success.
          if [ "${http_code}" != "204" ]; then
            echo "::error::workflow_dispatch failed with HTTP ${http_code}"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Triggered mono-better ${MONO_WORKFLOW_FILE} on ${MONO_TARGET_REF} for go-ivm@${GITHUB_SHA}"
